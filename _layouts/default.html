<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description | escape }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e8eefa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141d30" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/favicon.png">
<link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/icon.png">
<style>
/* Colours are the app's own tokens (Assets.xcassets/Tokens), light and dark. */
:root{
  --bg:#f4f5f7;
  --bg-top:#e8eefa;
  --surface:#ffffff;
  --surface2:#e8ebf0;
  --text:#111318;
  --text2:#4d5563;
  --text3:#626c7e;
  --divider:#e4e7ec;
  --accent:#1457d6;
  --on-accent:#ffffff;
  --accent-fill:rgba(20,87,214,.08);
  --accent-border:rgba(20,87,214,.28);
  --navy:#122f81;
  --success:#1b6f3f;
  --warning:#8a5a14;
  --neutral:#4d5563;
  --chip:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(18,47,129,.05), 0 10px 30px rgba(18,47,129,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1218;
    --bg-top:#141d30;
    --surface:#171c24;
    --surface2:#262d38;
    --text:#f1f3f6;
    --text2:#a3acba;
    --text3:#868e9b;
    --divider:#2a3240;
    --accent:#709cf6;
    --on-accent:#0e1218;
    --accent-fill:rgba(112,156,246,.10);
    --accent-border:rgba(112,156,246,.32);
    --success:#4ccb84;
    --warning:#f5b94a;
    --neutral:#a3acba;
    --chip:rgba(255,255,255,.06);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background-color:var(--bg);
  background-image:linear-gradient(180deg, var(--bg-top) 0, var(--bg) 420px);
  background-repeat:no-repeat;
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

.wrap{max-width:46rem;margin:0 auto;padding:0 18px}

header.bar{padding:34px 0 22px;text-align:center}
header.bar .icon{
  display:block;
  width:76px;height:76px;
  margin:0 auto 14px;
  border-radius:22.5%;
  box-shadow:0 6px 18px rgba(18,47,129,.22);
}
header.bar .app,h1,h2,h3{
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
header.bar .app{
  margin:0;
  font-size:1.4rem;
  font-weight:700;
  letter-spacing:-0.015em;
}
header.bar .sub{
  margin:2px 0 0;
  color:var(--text3);
  font-size:.9rem;
}

nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px;
}
nav a{
  display:inline-block;
  padding:7px 17px;
  border-radius:999px;
  background:var(--chip);
  color:var(--text2);
  text-decoration:none;
  font-size:.9rem;
  font-weight:500;
  transition:color .15s, background .15s;
}
nav a:hover{color:var(--accent)}
nav a.here,nav a.here:hover{
  background:var(--accent);
  color:var(--on-accent);
  font-weight:600;
  box-shadow:0 4px 10px rgba(0,0,0,.10);
}

main.card{
  background:var(--surface);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:38px 34px 34px;
  margin-bottom:26px;
}

main.card > :first-child{margin-top:0}
h1{font-size:1.85rem;line-height:1.25;letter-spacing:-0.02em;margin:0 0 .65em;font-weight:700}
h2{font-size:1.26rem;margin:2.1em 0 .5em;letter-spacing:-0.01em;font-weight:700}
h3{font-size:1.04rem;margin:1.9em 0 .4em;font-weight:650}
p,li{overflow-wrap:break-word}
main.card p,main.card li{color:var(--text2)}
main.card strong{color:var(--text)}
li{margin:.3em 0}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
strong{font-weight:650}
hr{border:0;border-top:1px solid var(--divider);margin:2.3em 0}

code{
  background:var(--surface2);
  color:var(--text);
  padding:.14em .4em;
  border-radius:5px;
  font-size:.88em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

/* "In short" panels */
blockquote{
  margin:1.4em 0;
  padding:.85em 1.1em;
  border:1px solid var(--accent-border);
  border-radius:14px;
  background:var(--accent-fill);
}
blockquote p{margin:.35em 0}
main.card blockquote p{color:var(--text)}

/* Pass classes, as the app shows them */
.tag{
  display:inline-block;
  padding:.08em .55em;
  border-radius:999px;
  font-size:.74em;
  font-weight:700;
  letter-spacing:.03em;
  white-space:nowrap;
  vertical-align:.08em;
  border:1px solid;
}
.tag.will{color:var(--success);background:color-mix(in srgb,var(--success) 12%,transparent);border-color:color-mix(in srgb,var(--success) 30%,transparent)}
.tag.can{color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent);border-color:color-mix(in srgb,var(--warning) 30%,transparent)}
.tag.pass{color:var(--neutral);background:color-mix(in srgb,var(--neutral) 10%,transparent);border-color:color-mix(in srgb,var(--neutral) 28%,transparent)}

.table-scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;margin:1.3em 0;font-size:.94rem}
th,td{border-bottom:1px solid var(--divider);padding:9px 12px;text-align:left;vertical-align:top;color:var(--text2)}
thead th{
  color:var(--text3);
  font-weight:600;
  font-size:.82rem;
  letter-spacing:.03em;
  text-transform:uppercase;
}
tbody td:first-child{color:var(--text);font-weight:600}
tbody tr:last-child td{border-bottom:0}

footer{
  padding:4px 0 54px;
  color:var(--text3);
  font-size:.86rem;
  text-align:center;
}
footer a{color:var(--text3);text-decoration:none}
footer a:hover{color:var(--accent);text-decoration:underline}
footer p{margin:.3em 0}

@media (max-width:560px){
  .wrap{padding:0 14px}
  header.bar{padding:24px 0 16px}
  header.bar .icon{width:64px;height:64px}
  main.card{padding:26px 20px 24px;border-radius:20px}
  h1{font-size:1.55rem}
  h2{font-size:1.15rem}
  nav a{padding:6px 14px;font-size:.86rem}
  table{font-size:.88rem}
  th,td{padding:8px 8px}
}
</style>
</head>
<body>

<div class="wrap">

  <header class="bar">
    <img class="icon" src="{{ site.baseurl }}/assets/icon.png" width="76" height="76" alt="Seen from Space app icon">
    <p class="app">Seen from Space</p>
    <p class="sub">Satellite Map</p>
    <nav>
      <a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="here"{% endif %}>Support</a>
      <a href="{{ site.baseurl }}/privacy"{% if page.url contains "privacy" %} class="here"{% endif %}>Privacy</a>
      <a href="{{ site.baseurl }}/terms"{% if page.url contains "terms" %} class="here"{% endif %}>Terms</a>
    </nav>
  </header>

  <main class="card">
{{ content }}
  </main>

  <footer>
    <p><a href="mailto:developer.barseghyan@gmail.com">developer.barseghyan@gmail.com</a></p>
    <p>Contains modified Copernicus Sentinel data.</p>
    <p>&copy; {{ site.time | date: "%Y" }} Tigran Barseghyan</p>
  </footer>

</div>

</body>
</html>
